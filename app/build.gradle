plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mhm.english'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mhm.english'
        minSdk 21
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }

    signingConfigs {
        release {
            // Same key on every build, so new versions install over old ones.
            storeFile file('mhm-english.jks')
            storePassword 'mhmenglish2026'
            keyAlias 'mhm'
            keyPassword 'mhmenglish2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
