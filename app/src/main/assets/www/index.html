<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MHM English</title>
<style>
/* VOICE: calm, tidy study notebook — comfortable for long reading, day or night
   IDEA: a well-made phrasebook: chapters (categories), tabs (folders), cards you can hear
   PICTURE: the cards — large English line, Arabic reading in the accent colour, quiet meaning
   COLOUR and TYPE: user-chosen accent on a white / paper / gray ground; system Arabic + Latin fonts
   LAYOUT: slim 52px bar, list or grid tiles, single-column cards, bottom sheet for word help */
:root{--accent:#c8352a;--on-accent:#fff;--bg:#f6f5f2;--surface:#fff;--surface2:#efede8;--ink:#1d1b22;--muted:#68646f;--line:#e5e1da;--hl:rgba(200,53,42,.10);--ok:#1f7a4d;--gold:#d99a00;--fs:16px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.en,.ltr{direction:ltr;unicode-bidi:isolate;font-family:system-ui,"Roboto","Segoe UI",sans-serif}

.bar{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar.color{background:var(--accent);color:var(--on-accent);border-bottom:0}
.bar h1{flex:1;margin:0 4px;font-size:1.05rem;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font-size:.72rem;font-weight:400;opacity:.75}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;flex:none;color:inherit}
.ib:active{background:var(--surface2)}
.bar.color .ib:active{background:rgba(255,255,255,.18)}
.ib svg{width:22px;height:22px}

.wrap{max-width:860px;margin:0 auto;padding:10px 10px 110px}
h2.cat{font-size:.82rem;color:var(--muted);font-weight:700;margin:16px 4px 6px;display:flex;align-items:center;gap:8px}
h2.cat::after{content:"";flex:1;height:1px;background:var(--line)}

.today{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px;width:100%;text-align:start}
.ring{width:48px;height:48px;flex:none;position:relative}
.ring svg{width:48px;height:48px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem}
.today .tx{flex:1}.today .tx b{display:block;font-size:1rem}.today .tx span{color:var(--muted);font-size:.82rem}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:8px}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;padding:8px 0}
.search svg{width:20px;height:20px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.qk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;line-height:1.2;text-align:center}
.qk svg{width:20px;height:20px;color:var(--accent)}
.qk b{font-size:.78rem}

.tiles{display:grid;gap:6px}
.tiles.list{grid-template-columns:1fr}
.tiles.grid{grid-template-columns:repeat(auto-fill,minmax(min(46%,190px),1fr))}
.tiles.grid-sm{grid-template-columns:repeat(auto-fill,minmax(min(30%,120px),1fr))}
.tile{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;position:relative}
.tile:active{transform:scale(.99)}
.badge{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 .82rem/1 system-ui,sans-serif;direction:ltr;letter-spacing:-.3px}
.tile .tx{flex:1;display:block}
.tile b{display:block;font-size:.94rem;line-height:1.3}
.tile small{display:block;color:var(--muted);font-size:.74rem;line-height:1.4;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:block;height:3px;border-radius:3px;background:var(--surface2);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:4px}
.chev{color:var(--muted);font-size:1.2rem}
.tile[aria-pressed=true]{border-color:var(--accent);background:var(--hl)}
.tiles.grid .tile,.tiles.grid-sm .tile{flex-direction:column;align-items:stretch;text-align:center;padding:10px 8px 9px;gap:6px}
.tiles.grid .badge{width:46px;height:46px;font-size:.92rem;margin:0 auto}
.tiles.grid-sm .badge{width:34px;height:34px;font-size:.7rem;border-radius:10px;margin:0 auto}
.tiles.grid-sm .tile{padding:8px 4px 7px;gap:5px}
.tiles.grid .chev,.tiles.grid-sm .chev{display:none}
.tiles.grid-sm small{display:none}
.tiles.grid-sm b{font-size:.76rem;line-height:1.25}
.tiles.grid small{white-space:normal}
.fic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 .78rem/1 system-ui,sans-serif;direction:ltr}
.tiles.grid .fic,.tiles.grid-sm .fic{margin:0 auto}

.shead{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.shead .tx{flex:1}.shead b{font-size:1.05rem;display:block}.shead small{color:var(--muted);font-size:.8rem}

.tools{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 8px;padding:2px 12px 4px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:38px;font-size:.85rem;white-space:nowrap}
.pill svg{width:17px;height:17px}
.pill.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px 6px;transition:background .25s,border-color .25s}
.card.on{border-color:var(--accent);background:var(--hl)}
.top{display:flex;align-items:flex-start;gap:12px}
.top .txt{flex:1}
.card .en.big{font-size:1.2rem;font-weight:700;line-height:1.35;text-align:left;margin:0}
.tr{color:var(--accent);font-size:1.06rem;font-weight:700;margin-top:3px}
.ar{color:var(--muted);font-size:1rem;margin-top:1px}
.note{font-size:.9rem;background:var(--surface2);border-radius:12px;padding:7px 10px;margin-top:8px;line-height:1.75}
.spk{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.spk svg{width:22px;height:22px}
.spk.sm{width:38px;height:38px;box-shadow:none}.spk.sm svg{width:18px;height:18px}
.acts{display:flex;gap:2px;margin-top:8px;border-top:1px solid var(--line);padding-top:3px;flex-wrap:wrap}
.ab{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;border-radius:10px;padding:5px 8px;min-height:36px;font-size:.8rem;color:var(--muted)}
.ab svg{width:18px;height:18px}
.ab:active{background:var(--surface2)}
.ab.fv[aria-pressed=true]{color:var(--gold)}
.ab.ln[aria-pressed=true]{color:var(--ok)}
.card.done .en.big::after,.card.done .rt::after{content:" ✓";color:var(--ok);font-size:1rem}
.rhead{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}.rhead .spk{margin-inline-start:auto}.rt.art{font-size:1.08rem;direction:rtl;font-family:inherit;line-height:1.5}
.rt{font:800 1.45rem/1.2 system-ui,sans-serif;direction:ltr;color:var(--accent);background:var(--hl);border-radius:12px;padding:4px 12px}
.rs{font-size:1rem;font-weight:700;flex:1 1 40%;line-height:1.45}
.ex{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.ex li{display:flex;align-items:center;gap:10px;border-radius:12px;padding:7px 6px}
.ex li+li{border-top:1px dashed var(--line);border-radius:0}
.ex li.on{background:var(--hl);border-radius:12px}
.ex .t{flex:1}
.ex .e{font-size:1.08rem;font-weight:700;text-align:left}
.ex .e mark,.en mark{background:none;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.ex .a{font-size:.88rem;color:var(--muted)}.ex .a b{color:var(--accent)}
.hide-tr .tr,.hide-tr .ex .a b{filter:blur(7px)}
.hide-ar .ar,.hide-ar .ex .a span{filter:blur(7px)}
.lhero{display:flex;align-items:center;gap:10px}
.lbox{width:52px;height:58px;border-radius:14px;display:grid;place-items:center;font:800 2.2rem/1 system-ui,sans-serif;background:var(--hl);color:var(--accent)}
.lbox.lo{background:var(--surface2);color:var(--ink)}
.lname{flex:1}.lname b{display:block;font-size:1.1rem}.lname small{color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--gold);color:#241a00;margin-top:4px}
.num{font:800 1.7rem/1.2 system-ui,sans-serif;direction:ltr;color:var(--accent);margin-bottom:2px;text-align:left}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:.9rem}
.tbl td{border-top:1px solid var(--line);padding:7px 6px;vertical-align:top}
.tbl td:first-child{color:var(--muted);width:40%;font-weight:700}
.tbl td:last-child{direction:ltr;text-align:left;unicode-bidi:plaintext}
.empty{text-align:center;color:var(--muted);padding:50px 14px;line-height:1.9}

.rd-tools{position:sticky;top:52px;z-index:10;background:var(--bg);padding:8px 0;display:grid;gap:8px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:.8rem;min-height:36px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:700}
.rd-row{display:flex;gap:8px;align-items:center}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.play svg{width:24px;height:24px}
.passage{user-select:none;-webkit-user-select:none;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;direction:ltr;text-align:left;font-family:Georgia,"Noto Serif",serif;font-size:1.25rem;line-height:2.05}
.passage .w{border-radius:6px;padding:1px 1px;cursor:pointer}
.passage .w.on{background:var(--accent);color:var(--on-accent)}
.passage .w.read{color:var(--muted)}
.passage .w.pick{outline:2px solid var(--accent)}
.rd-ar{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px;line-height:2;color:var(--muted)}
.lvl{display:inline-block;font:700 .72rem/1 system-ui;border-radius:999px;padding:4px 8px;background:var(--surface2);color:var(--muted);direction:ltr}
.field{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;margin-bottom:10px}
textarea.field{min-height:240px;direction:ltr;text-align:left;line-height:1.7}
.btn{border:0;border-radius:12px;padding:11px 18px;min-height:46px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:#fde8e6;color:#a92b21}

.wbar{position:fixed;left:8px;right:8px;bottom:10px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);display:grid;gap:6px}
.wbar .wt{display:flex;align-items:center;gap:8px;padding:0 4px}.wbar .wt b{flex:1;font:800 1.3rem/1.2 system-ui,sans-serif;direction:ltr;text-align:left}.wbar .wt span{color:var(--muted);font-size:.85rem}
.wbar .wb{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.wbar .wb button{border:0;background:var(--surface2);border-radius:12px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;line-height:1.15}
.wbar .wb button svg{width:20px;height:20px;color:var(--accent)}
.passage .w.sent{background:var(--hl)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px 22px;max-height:80vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.sh-word{font:800 2rem/1.2 system-ui,sans-serif;direction:ltr;text-align:center}
.sh-mean{text-align:center;margin-top:4px}
.letters{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;direction:ltr;margin:10px 0}
.letters button{min-width:40px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font:800 1.2rem system-ui}
.letters button.v{background:var(--hl);color:var(--accent);border-color:transparent}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;justify-content:center}
.hints span{font-size:.8rem;background:var(--surface2);border-radius:999px;padding:4px 10px}
.sh-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.sh-acts button{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;min-height:46px;font-size:.88rem}
.sh-acts svg{width:18px;height:18px}

.flash{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 18px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.flash .en{font-size:1.6rem;font-weight:800}
.fl-nav{display:flex;gap:8px;margin-top:12px}.fl-nav .btn{flex:1}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font-size:1.35rem;line-height:1.2}.kpi span{color:var(--muted);font-size:.8rem}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 10px 10px;margin-top:10px}
.chart-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}.chart-h b{flex:1;text-align:center;font-size:.92rem}
.bars{display:flex;align-items:flex-end;gap:4px;height:170px}
.bar-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.bar-c i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px;opacity:.85}
.bar-c.today i{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.bar-c em{font-style:normal;font-size:.66rem;color:var(--muted);white-space:nowrap}
.bar-c small{font-size:.62rem;color:var(--muted);height:14px;white-space:nowrap}

.set{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.set>label{display:block;font-weight:700;margin-bottom:8px;font-size:.95rem}
.set p{margin:0 0 8px;color:var(--muted);font-size:.85rem}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:42px;height:42px;border-radius:50%;border:3px solid transparent}
.sw button[aria-pressed=true]{border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.switch{width:50px;height:30px;border-radius:30px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s}
.switch[aria-pressed=true]{background:var(--accent)}.switch[aria-pressed=true]::after{right:23px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:12px;font-size:.88rem;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.notice{position:fixed;left:10px;right:10px;bottom:12px;z-index:50;background:#fff4d6;color:#4a3700;border-radius:14px;padding:10px 12px;font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.notice button{background:#4a3700;color:#fff;border:0;border-radius:9px;padding:7px 12px}
.foot{color:var(--muted);font-size:.76rem;text-align:center;margin-top:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="bar" id="bar">
  <button class="ib" id="back" aria-label="رجوع" hidden></button>
  <h1 id="ttl">MHM English</h1>
  <button class="ib" id="layoutBtn" aria-label="طريقة العرض" hidden></button>
  <button class="ib" id="homeBtn" aria-label="الرئيسية" hidden></button>
  <button class="ib" id="setBtn" aria-label="الإعدادات"></button>
</div>
<div class="wrap" id="app"></div>
<div id="sheetHost"></div>
<div class="notice" id="notice" hidden></div>
<div class="toast" id="toast"></div>

<script src="data/core.js"></script>
<script src="data/letters.js"></script>
<script src="data/rules.js"></script>
<script src="data/rules2.js"></script>
<script src="data/words.js"></script>
<script src="data/numbers.js"></script>
<script src="data/vocab.js"></script>
<script src="data/grammar.js"></script>
<script src="data/grammar2.js"></script>
<script src="data/intermediate.js"></script>
<script src="data/sentences1.js"></script>
<script src="data/sentences2.js"></script>
<script src="data/it.js"></script>
<script src="data/sentences3.js"></script>
<script src="data/passages.js"></script>
<script src="app.js"></script>
</body>
</html>
