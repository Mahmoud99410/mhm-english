name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use the runner's Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "::notice::platforms: $(ls $ANDROID_HOME/platforms | tr '\n' ' ') build-tools: $(ls $ANDROID_HOME/build-tools | tr '\n' ' ')"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log || { grep -A8 -E "What went wrong|error:|e: " build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MHM-English-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MHM-English-APK
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MHM English v1.0.${{ github.run_number }}
          files: out/*.apk
